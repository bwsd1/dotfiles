# Kernel and network hardening.
#
# Installed as /etc/sysctl.d/99-hardening.conf. The 99- prefix makes this
# the last file read, so it overrides distribution defaults.
#
# Every setting here is safe on a Debian 13 workstation that runs Docker
# and a sandboxed browser. Settings that cost performance, break
# debugging, or disable hardware live in 99-hardening-optional.conf.
#
# Apply without rebooting:  sudo sysctl --system
# Verify one value:         sysctl kernel.kptr_restrict

## Kernel information leaks

# Hide kernel pointers from unprivileged users, including in /proc/kallsyms
# and dmesg. Defeats the usual first step of a kernel exploit: locating
# where the kernel actually is.
kernel.kptr_restrict = 2

# Restrict dmesg to root, so unprivileged processes cannot read kernel
# addresses and crash traces out of the ring buffer.
kernel.dmesg_restrict = 1

# Do not print anything above KERN_ERR to the console.
kernel.printk = 3 3 3 3

## Kernel attack surface

# Disable loading a new kernel via kexec. Without this, root can boot an
# arbitrary kernel and bypass the entire verified boot chain in place.
kernel.kexec_load_disabled = 1

# Disable the SysRq key entirely. It gives anyone at the keyboard a set of
# privileged operations, including dropping to a root shell on some
# configurations. Set to 176 instead if you want to keep the sync,
# remount-read-only and reboot subset for crash recovery.
kernel.sysrq = 0

# Full address space layout randomisation for stack, heap, mmap and VDSO.
kernel.randomize_va_space = 2

# Maximum entropy for mmap base randomisation. 32 is the ceiling on
# x86_64; the compat value applies to 32-bit binaries.
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

# Deny unprivileged use of userfaultfd. It is a recurring building block
# for heap-spray and use-after-free exploits because it lets an attacker
# pause the kernel mid-operation and win an otherwise tight race.
vm.unprivileged_userfaultfd = 0

# Do not autoload TTY line disciplines on demand. Several line discipline
# drivers are rarely used and have a poor security record.
dev.tty.ldisc_autoload = 0

# Unprivileged BPF is a large kernel attack surface reachable from any
# process. 2 is the Debian default; pinned here so it survives a change
# in distribution policy.
kernel.unprivileged_bpf_disabled = 2

# Harden the BPF JIT against spraying attacks that use JITted constants as
# an instruction primitive. Applies to privileged users too.
net.core.bpf_jit_harden = 2

# Restrict perf to root. perf_event_open has historically been one of the
# most productive sources of local privilege escalation.
kernel.perf_event_paranoid = 3

## Process isolation

# Restrict ptrace to direct children. Without this, any process can attach
# to any other process of the same uid and read its memory, which makes a
# single compromised process enough to harvest credentials from every
# other one you are running.
#
# 1 keeps gdb and strace working when you launch the target yourself, but
# breaks attaching to an already-running process by pid. Use
#   sudo gdb -p <pid>
# in that case, or temporarily set this to 0.
kernel.yama.ptrace_scope = 1

# Never produce a core dump for a setuid or otherwise privileged binary.
fs.suid_dumpable = 0

## Filesystem

# Refuse to follow symlinks and hardlinks in world-writable sticky
# directories when the follower is not the owner. Closes the classic
# /tmp symlink race.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# Refuse opens of FIFOs and regular files in world-writable sticky
# directories owned by another user. Same class of /tmp attack.
fs.protected_fifos = 2
fs.protected_regular = 2

## Network

# Reverse path filtering in loose mode: drop packets whose source address
# is not reachable via any interface.
#
# Loose rather than strict (1) deliberately. Strict mode drops packets
# that arrive asymmetrically, which is exactly what happens with Docker
# bridge networks and split-tunnel VPNs, and it fails silently. Set to 1
# if you run neither.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Ignore ICMP redirects. Accepting them lets anyone on the local segment
# rewrite your routing table and become a man in the middle.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# This is a workstation, not a router: never send redirects either.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Reject source-routed packets, which let a sender choose the return path
# and bypass routing-based filtering.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Log packets with impossible source addresses.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Do not answer broadcast pings, and ignore bogus ICMP error replies.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# SYN cookies, and RFC 1337 protection against TIME-WAIT assassination.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1

# Drop TCP timestamps. They leak system uptime and, on some kernels, a
# usable estimate of boot time, which helps fingerprint and correlate a
# host across networks.
net.ipv4.tcp_timestamps = 0

# IPv6 privacy extensions: prefer a rotating temporary address over one
# derived from the interface identifier, so the address does not follow
# the machine between networks.
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# net.ipv4.ip_forward is deliberately not set here. Docker enables it at
# daemon start and container networking stops working without it; setting
# it to 0 produces a value that silently flips back on the next boot.

# user.max_user_namespaces and kernel.unprivileged_userns_clone are
# deliberately left enabled. Disabling unprivileged user namespaces is
# standard hardening advice, but on this machine it would break the
# Chromium and Firefox sandboxes and rootless containers. Removing the
# browser's own sandbox to reduce kernel attack surface is a net loss:
# the browser is the component actually exposed to hostile input.
