# Resource limits.
#
# Installed as /etc/security/limits.d/99-hardening.conf. Applied by
# pam_limits at login, so it takes effect on the next login, not
# immediately in an existing session.
#
# The systemd coredump drop-in stops the system core dump handler from
# writing dumps. This stops the kernel producing them in the first place,
# which also covers processes that set their own core_pattern.
#
# Verify: ulimit -Hc   (expect 0)

*       hard    core    0
root    hard    core    0
