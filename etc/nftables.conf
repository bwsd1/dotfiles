#!/usr/sbin/nft -f
#
# Default-deny inbound firewall for a workstation.
#
# Installed as /etc/nftables.conf. Enable with:
#   sudo systemctl enable --now nftables
#
# Check syntax without applying:  sudo nft --check --file /etc/nftables.conf
# Show what is actually loaded:   sudo nft list ruleset
# Panic button:                   sudo nft flush ruleset
#
# The policy is to drop everything inbound that is not a reply to
# something we sent. If you run a service that has to accept connections,
# add a specific rule for it rather than relaxing the policy.

# Replace only this table, rather than opening with `flush ruleset` as the
# Debian default file does. A flush destroys every table in the ruleset,
# including the nat and filter tables Docker installs through
# iptables-nft. Reloading this file by hand would then silently break
# networking for every running container until the docker service was
# restarted. Creating the table before deleting it makes the delete
# idempotent on a first run, where it does not exist yet.
table inet filter
delete table inet filter

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		# Loopback first. Dropping lo breaks more than it protects, and
		# anything spoofing 127.0.0.0/8 from a real interface is hostile.
		iif lo accept
		iif != lo ip saddr 127.0.0.0/8 drop
		iif != lo ip6 saddr ::1 drop

		# Replies to connections we opened.
		ct state established,related accept
		ct state invalid drop

		# ICMPv6 is not optional. IPv6 requires neighbour discovery and
		# multicast listener discovery to function at all; filtering these
		# does not harden anything, it just breaks IPv6 in ways that look
		# like a flaky network.
		icmpv6 type {
			destination-unreachable,
			packet-too-big,
			time-exceeded,
			parameter-problem,
			mld-listener-query,
			mld-listener-report,
			mld-listener-done,
			nd-router-solicit,
			nd-router-advert,
			nd-neighbor-solicit,
			nd-neighbor-advert
		} accept

		# IPv4 error signalling. Dropping fragmentation-needed is the
		# classic cause of connections that open and then hang forever, so
		# path MTU discovery has to keep working. Echo requests are not
		# included: this host does not answer pings.
		icmp type {
			destination-unreachable,
			time-exceeded,
			parameter-problem
		} accept

		# DHCP client, v4 and v6.
		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

		# Anything that reaches here is dropped by policy. Log a sample so
		# there is a trail, rate limited so a flood cannot fill the disk
		# or push real entries out of the journal.
		limit rate 5/minute burst 10 packets \
			log prefix "nft-input-drop " level info
	}

	chain output {
		type filter hook output priority filter; policy accept;

		# Egress filtering is left open deliberately. A default-deny
		# outbound policy on a workstation that runs a browser, a package
		# manager and Docker degenerates into an allow-all list within a
		# week, and the version that does not is unusable. If you want
		# outbound control, do it with per-application confinement
		# (AppArmor, systemd unit sandboxing) rather than port numbers.
	}

	# There is deliberately no forward chain here.
	#
	# Docker manages forwarding through iptables-nft, which writes into
	# the legacy `ip filter` FORWARD chain. An `inet filter` forward chain
	# with policy drop would sit alongside those rules, and a packet must
	# pass every table it traverses: container networking would break, and
	# `nft list ruleset` would show Docker's ACCEPT rules present and
	# apparently correct while traffic still vanished.
}
