# Kernel command line hardening.
#
# Installed as /etc/default/grub.d/99-hardening.cfg. Debian's
# grub-mkconfig sources every *.cfg in that directory after reading
# /etc/default/grub, so this appends to the distribution's setting
# instead of replacing the file.
#
# Apply:  sudo update-grub && sudo reboot
# Verify: cat /proc/cmdline
#
# To back out, delete this file, run update-grub, and reboot. If the
# machine will not boot, press 'e' at the GRUB menu and remove the
# offending parameter for that boot only.

GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT \
slab_nomerge \
init_on_alloc=1 \
init_on_free=1 \
page_alloc.shuffle=1 \
randomize_kstack_offset=on \
vsyscall=none \
intel_iommu=on \
iommu.strict=1 \
iommu.passthrough=0 \
efi=disable_early_pci_dma \
random.trust_cpu=off \
random.trust_bootloader=off \
lockdown=confidentiality"

# slab_nomerge
#	Stop the allocator merging slab caches of similar size. Merging lets
#	an attacker who can groom one cache influence objects belonging to an
#	unrelated, more interesting one, which is the basis of most modern
#	heap exploitation.
#
# init_on_alloc=1 init_on_free=1
#	Zero pages and heap objects on both allocation and free. This turns a
#	large class of uninitialised-memory and use-after-free bugs from
#	exploitable into a null dereference. Costs a few percent throughput
#	on allocation-heavy work; init_on_free is the more expensive half.
#
# page_alloc.shuffle=1
#	Randomise the page allocator freelist so the address of the next
#	allocation is not predictable.
#
# randomize_kstack_offset=on
#	Randomise the kernel stack offset on every syscall entry, so a stack
#	layout leaked once is not valid for the next call.
#
# vsyscall=none
#	Remove the legacy vsyscall page. It sits at a fixed address in every
#	process and is therefore a reliable ROP gadget source. Only breaks
#	statically linked binaries older than roughly 2013.
#
# intel_iommu=on iommu.strict=1 iommu.passthrough=0
#	Put peripherals behind the IOMMU and flush its TLB synchronously on
#	unmap. This is what stops a malicious PCIe or Thunderbolt device
#	reading arbitrary system memory over DMA. Strict mode costs some I/O
#	throughput; on a workstation it is not noticeable.
#
# efi=disable_early_pci_dma
#	Close the window before the IOMMU is configured, during which a
#	device attached at boot can DMA freely.
#
# random.trust_cpu=off random.trust_bootloader=off
#	Do not credit RDRAND or the bootloader-supplied seed as entropy on
#	their own; mix them in without counting them. Relevant precisely to
#	the threat model where the CPU's hardware RNG is assumed to be
#	influenced. Costs a little boot latency while the pool fills.
#
# lockdown=confidentiality
#	Cut the paths by which root extracts secrets from kernel memory:
#	/dev/mem, /proc/kcore, kprobes, and BPF reads of kernel addresses.
#	Integrity mode, which blocks loading unsigned code, comes for free
#	once Secure Boot is on; confidentiality is the half that has to be
#	asked for, and it is what keeps a root shell from reading keys out
#	of the running kernel.
#
#	The mode is only as strong as what enforces it. Anyone reaching the
#	GRUB menu can delete this parameter for one boot, so it is worth
#	having only alongside Secure Boot and a GRUB password.
#
#	Costs kernel debugging and crash dumps: perf and BPF kernel-memory
#	reads, kdump, and hibernation all stop working. None of those are
#	installed or configured here. Docker keeps working; its BPF use is
#	seccomp and cgroup filtering, which confidentiality does not touch.
