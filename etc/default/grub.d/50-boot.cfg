# Boot menu timeout.
#
# Installed as /etc/default/grub.d/50-boot.cfg. Debian's default of 5 s is
# added to every boot before the kernel starts, and systemd-analyze does
# not count it. One second still leaves time to press an arrow key, which
# stops the countdown; holding Shift or Esc while GRUB loads also brings
# up the menu.
#
# Apply:  sudo update-grub

GRUB_TIMEOUT=1
