# Refuse to autoload kernel modules that this machine has no use for.
#
# Installed as /etc/modprobe.d/99-hardening.conf.
#
# "install <mod> /bin/false" is the part that does the work: a bare
# "blacklist" only prevents autoloading by alias, and still allows an
# explicit "modprobe <mod>". Both lines together mean the module cannot be
# loaded without editing this file.
#
# Blacklist only what you do not use. Verify against the target host
# before adopting any of this, and drop the lines that do not apply:
#   lsmod | grep -E 'dccp|sctp|firewire|bluetooth'
#   findmnt -rno FSTYPE | sort -u
#
# Changes take effect on reboot, or immediately for anything not already
# loaded. Rebuild the initramfs afterwards:
#   sudo update-initramfs -u

## Rare network protocols
#
# These are reachable from unprivileged userspace through socket(2) with
# the right address family, which is how they keep turning up in local
# privilege escalation writeups. None of them is used by a normal desktop.

install dccp /bin/false
blacklist dccp
install sctp /bin/false
blacklist sctp
install rds /bin/false
blacklist rds
install tipc /bin/false
blacklist tipc
install n-hdlc /bin/false
blacklist n-hdlc
install ax25 /bin/false
blacklist ax25
install netrom /bin/false
blacklist netrom
install x25 /bin/false
blacklist x25
install rose /bin/false
blacklist rose
install decnet /bin/false
blacklist decnet
install econet /bin/false
blacklist econet
install af_802154 /bin/false
blacklist af_802154
install ipx /bin/false
blacklist ipx
install appletalk /bin/false
blacklist appletalk
install psnap /bin/false
blacklist psnap
install p8023 /bin/false
blacklist p8023
install p8022 /bin/false
blacklist p8022
install can /bin/false
blacklist can
install atm /bin/false
blacklist atm

## Uncommon filesystems
#
# Filesystem parsers are large and are fed attacker-controlled bytes the
# moment someone plugs in a USB stick. Keep the drivers for filesystems
# actually mounted, and refuse the rest.

install cramfs /bin/false
blacklist cramfs
install freevxfs /bin/false
blacklist freevxfs
install jffs2 /bin/false
blacklist jffs2
install hfs /bin/false
blacklist hfs
install hfsplus /bin/false
blacklist hfsplus
install udf /bin/false
blacklist udf
install ufs /bin/false
blacklist ufs
install gfs2 /bin/false
blacklist gfs2

# squashfs is deliberately NOT blacklisted: snapd mounts every installed
# snap as a squashfs image over a loop device, so blocking the module
# stops snaps from mounting and leaves snapd failing at boot. Some
# AppImage runtimes need it too. The loop driver it depends on is not
# blacklisted either.

## DMA-capable buses
#
# FireWire and Thunderbolt both grant peripherals direct memory access.
# That is the standard route for an evil-maid attack: plug in a device,
# read the encryption key straight out of RAM. Absent that hardware the
# drivers are pure attack surface; remove these lines if the host has a
# Thunderbolt port you intend to use.

install firewire-core /bin/false
blacklist firewire-core
install firewire-ohci /bin/false
blacklist firewire-ohci
install firewire-sbp2 /bin/false
blacklist firewire-sbp2
install thunderbolt /bin/false
blacklist thunderbolt

## Misc

# vivid is a video test-pattern driver with no purpose outside kernel
# development, and a long history of being the vehicle in local
# privilege escalation proofs of concept.
install vivid /bin/false
blacklist vivid

# Bluetooth. Remove these four lines on any host with a Bluetooth radio
# in use, including one driving a keyboard or mouse.
install bluetooth /bin/false
blacklist bluetooth
install btusb /bin/false
blacklist btusb

# usb-storage is deliberately NOT blacklisted: it would stop every USB
# mass storage device from working, including recovery media. See
# 99-hardening-optional.conf.example if you want that trade.
