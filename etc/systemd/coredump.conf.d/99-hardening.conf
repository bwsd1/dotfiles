# Do not persist core dumps.
#
# Installed as /etc/systemd/coredump.conf.d/99-hardening.conf.
#
# A core dump is a verbatim copy of a process's memory written to disk,
# frequently world-readable at some point in its life and rarely cleaned
# up. For a browser or an agent holding keys, that is the entire secret
# store sitting in /var/lib/systemd/coredump.
#
# Apply:  sudo systemctl daemon-reload
# Verify: systemd-analyze cat-config systemd/coredump.conf

[Coredump]
Storage=none
ProcessSizeMax=0
