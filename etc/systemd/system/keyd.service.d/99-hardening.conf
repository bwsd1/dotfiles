# Confine keyd to the privileges it actually needs.
#
# Installed as /etc/systemd/system/keyd.service.d/99-hardening.conf. The
# unit itself is packaged, in /usr/lib/systemd/system/keyd.service; this
# drop-in only adds to it, so a keyd upgrade replacing the unit cannot
# quietly drop the hardening with it.
#
# keyd needs four things: read and grab evdev input devices, write the
# virtual keyboard through /dev/uinput, CAP_SETGID to switch to the keyd
# group before creating its control socket, and CAP_SYS_NICE because it
# calls nice(-20) at startup and exits 255 if that fails. Everything else
# is shut off, including IP networking (the control socket is unix).
# ReadWritePaths=/run because it creates /run/keyd.socket directly in
# /run, not in a subdirectory.
#
# CAP_SYS_NICE has to be granted rather than worked around. The service
# runs as root, but for a root process the permitted set at exec is
# capped by the bounding set, so a bounding set without it means
# setpriority(2) returns EPERM and the daemon dies during startup.
# Setting Nice=-20 here instead also works, because the kernel only
# demands the capability when the new value is strictly lower than the
# current one, but that leans on an implementation detail for no real
# gain: the capability buys scheduling priority and nothing else.
#
# uinput autoloads through its kmod static device node, so keyd never
# needs module-loading rights itself.
#
# Apply:  sudo systemctl daemon-reload && sudo systemctl restart keyd
# Verify: systemctl show keyd -p CapabilityBoundingSet -p NoNewPrivileges

[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_SETGID CAP_SYS_NICE
ProtectSystem=strict
ReadWritePaths=/run
ProtectHome=yes
PrivateTmp=yes
DevicePolicy=closed
DeviceAllow=char-input rw
DeviceAllow=/dev/uinput rw
IPAddressDeny=any
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_UNIX AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
